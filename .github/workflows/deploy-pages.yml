# Build, test and publish the app to GitHub Pages on every push to main.
# The hosted copy runs the `web` quality tier (src/app/device.ts): lighter
# settings plus automatic quality reduction. GitHub Pages cannot send the
# COOP/COEP headers, so snapshots use copy transfer instead of SharedArrayBuffer.
#
# One-time setup: repository Settings → Pages → Source: "GitHub Actions".

name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      # Includes the golden-hash tests: a pass here also proves the simulation
      # reproduces bit-identically on Linux.
      - run: npm test
      - run: npx vite build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
